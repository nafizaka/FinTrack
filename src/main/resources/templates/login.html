
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .brand {
            color: #15966b;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-login {
            background: #15966b;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #107b57;
            color: white;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">FinTrack</div>

    <p class="subtitle">
        Selamat datang kembali!
    </p>

    <h4 class="text-center mb-4">Login ke Akunmu</h4>

    <div th:if="${param.registered}" class="alert alert-success">
        Registrasi berhasil! Silakan login.
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Email atau password salah.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Kamu berhasil logout.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="nama@email.com"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Masukkan password"
                   required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Login
        </button>

    </form>

    <div class="text-center mt-4">
        <span class="text-muted">Belum memiliki akun?</span>
        <a th:href="@{/register}" class="text-success fw-bold text-decoration-none">
            Daftar
        </a>
    </div>

</div>

</body>
</html>
