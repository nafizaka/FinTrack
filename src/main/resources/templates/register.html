
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | FinTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .brand {
            color: #15966b;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-register {
            background: #15966b;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: bold;
        }

        .btn-register:hover {
            background: #107b57;
            color: white;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="brand">FinTrack</div>

    <p class="subtitle">
        Mulai kelola keuanganmu dengan lebih mudah.
    </p>

    <h4 class="text-center mb-4">Buat Akun Baru</h4>

    <form th:action="@{/register}" th:object="${form}" method="post">

        <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   placeholder="Masukkan nama lengkap">

            <small class="text-danger"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">
            </small>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   placeholder="nama@email.com">

            <small class="text-danger"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
            </small>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   placeholder="Minimal 8 karakter">

            <small class="text-danger"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
            </small>
        </div>

        <button type="submit" class="btn btn-register w-100">
            Daftar Sekarang
        </button>

    </form>

    <div class="text-center mt-4">
        <span class="text-muted">Sudah memiliki akun?</span>
        <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">
            Login
        </a>
    </div>

</div>

</body>
</html>
