
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - FinTrack'">Transaksi - FinTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #172554;
        }
        .navbar-brand {
            color: white;
            font-weight: bold;
        }
        .main-content {
            padding: 40px 0;
        }
        .form-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 3px 15px rgba(0,0,0,.04);
        }
        .btn-primary {
            background: #2563eb;
            border: none;
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand text-decoration-none"
           href="/dashboard">FinTrack</a>

        <a href="/transactions"
           class="btn btn-outline-light btn-sm">
            Kembali
        </a>
    </div>
</nav>

<div class="container main-content">

    <div class="form-card">

        <h3 class="fw-bold mb-2" th:text="${pageTitle}">
            Tambah Transaksi
        </h3>

        <p class="text-muted mb-4">
            Masukkan informasi transaksi keuanganmu.
        </p>

        <form th:action="${formAction}"
              th:object="${form}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Jenis Transaksi</label>

                <select th:field="*{type}" class="form-select"
                        th:classappend="${#fields.hasErrors('type')}
                            ? ' is-invalid' : ''">

                    <option value="">Pilih Jenis Transaksi</option>
                    <option value="INCOME">Pemasukan</option>
                    <option value="EXPENSE">Pengeluaran</option>
                </select>

                <div class="invalid-feedback"
                     th:errors="*{type}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Jumlah (Rupiah)</label>

                <input type="number"
                       th:field="*{amount}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('amount')}
                           ? ' is-invalid' : ''"
                       placeholder="Contoh: 500000"
                       min="0.01"
                       step="0.01">

                <div class="invalid-feedback"
                     th:errors="*{amount}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Kategori</label>

                <select th:field="*{categoryId}"
                        class="form-select"
                        th:classappend="${#fields.hasErrors('categoryId')}
                            ? ' is-invalid' : ''">

                    <option value="">Pilih Kategori</option>

                    <option th:each="category : ${categories}"
                            th:value="${category.categoryId}"
                            th:text="${category.categoryName}">
                    </option>
                </select>

                <div class="invalid-feedback"
                     th:errors="*{categoryId}"></div>

                <small th:if="${#lists.isEmpty(categories)}"
                       class="text-danger">
                    Belum ada kategori. Silakan buat kategori terlebih dahulu.
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Tanggal Transaksi</label>

                <input type="date"
                       th:field="*{transactionDate}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('transactionDate')}
                           ? ' is-invalid' : ''">

                <div class="invalid-feedback"
                     th:errors="*{transactionDate}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Deskripsi</label>

                <textarea th:field="*{description}"
                          class="form-control"
                          rows="3"
                          placeholder="Contoh: Gaji bulanan, belanja kebutuhan, dan lainnya"></textarea>

                <div class="text-danger small"
                     th:errors="*{description}"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">

                <a href="/transactions"
                   class="btn btn-light border">
                    Batal
                </a>

                <button type="submit" class="btn btn-primary"
                        th:disabled="${#lists.isEmpty(categories)}">
                    Simpan Transaksi
                </button>

            </div>

        </form>

    </div>
</div>

</body>
</html>
