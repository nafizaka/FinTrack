
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | FinTrack'">
        Kategori | FinTrack
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7f6;
            font-family: Arial, sans-serif;
            color: #26352e;
        }

        .navbar {
            background: white;
            padding: 16px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .brand {
            color: #15966b;
            font-size: 25px;
            font-weight: bold;
        }

        .main-content {
            padding: 40px 0;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.035);
        }

        .form-label {
            font-weight: 600;
        }

        .btn-success {
            background: #15966b;
            border-color: #15966b;
        }

        .btn-success:hover {
            background: #087c58;
            border-color: #087c58;
        }

        @media (max-width: 576px) {
            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="brand text-decoration-none" th:href="@{/dashboard}">
            FinTrack
        </a>

        <a th:href="@{/categories}"
           class="btn btn-outline-success btn-sm">
            Kembali
        </a>

    </div>
</nav>

<main class="container main-content">

    <div class="form-card">

        <h3 class="fw-bold mb-2" th:text="${pageTitle}">
            Tambah Kategori
        </h3>

        <p class="text-muted mb-4">
            Masukkan informasi kategori keuanganmu.
        </p>

        <!-- Error Message -->
        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <form th:action="${formAction}"
              th:object="${form}"
              method="post">

            <!-- Nama Kategori -->
            <div class="mb-3">

                <label class="form-label">
                    Nama Kategori
                </label>

                <input type="text"
                       th:field="*{categoryName}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('categoryName')}
                           ? ' is-invalid' : ''"
                       placeholder="Contoh: Makanan, Gaji, Transportasi">

                <div class="invalid-feedback"
                     th:errors="*{categoryName}">
                </div>

            </div>

            <!-- Jenis Kategori -->
            <div class="mb-4">

                <label class="form-label">
                    Jenis Kategori
                </label>

                <select th:field="*{type}"
                        class="form-select"
                        th:classappend="${#fields.hasErrors('type')}
                            ? ' is-invalid' : ''">

                    <option value="">
                        Pilih Jenis Kategori
                    </option>

                    <option value="INCOME">
                        Pemasukan
                    </option>

                    <option value="EXPENSE">
                        Pengeluaran
                    </option>

                </select>

                <div class="invalid-feedback"
                     th:errors="*{type}">
                </div>

            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/categories}"
                   class="btn btn-light border">
                    Batal
                </a>

                <button type="submit"
                        class="btn btn-success">
                    Simpan Kategori
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
