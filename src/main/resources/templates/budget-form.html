
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - FinTrack'">Budget Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172554;
        }

        .navbar-brand {
            font-weight: bold;
            color: white;
        }

        .main-content {
            padding: 35px 0;
        }

        .form-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,.04);
            max-width: 650px;
            margin: auto;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">FinTrack</a>

        <div class="d-flex align-items-center gap-3">
            <a href="/budgets" class="text-white text-decoration-none">
                Budget
            </a>

            <a href="/dashboard" class="text-white text-decoration-none">
                Dashboard
            </a>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">
                    Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container main-content">

    <div class="form-card">

        <h3 class="fw-bold mb-2" th:text="${pageTitle}">
        </h3>

        <p class="text-muted mb-4">
            Tentukan batas pengeluaran berdasarkan kategori dan periode.
        </p>

        <form th:action="${formAction}"
              th:object="${form}"
              method="post">

            <!-- Kategori -->
            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Kategori Pengeluaran
                </label>

                <select th:field="*{categoryId}"
                        class="form-select"
                        required>

                    <option value="">Pilih Kategori</option>

                    <option th:each="category : ${categories}"
                            th:value="${category.categoryId}"
                            th:text="${category.categoryName}">
                    </option>

                </select>

                <div class="text-danger small mt-1"
                     th:errors="*{categoryId}">
                </div>

                <div th:if="${#lists.isEmpty(categories)}"
                     class="text-danger small mt-1">
                    Belum ada kategori pengeluaran.
                    Silakan buat kategori terlebih dahulu.
                </div>

            </div>

            <!-- Nominal -->
            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Batas Anggaran (Rp)
                </label>

                <input type="number"
                       th:field="*{amountLimit}"
                       class="form-control"
                       min="0.01"
                       step="0.01"
                       placeholder="Contoh: 1000000"
                       required>

                <div class="text-danger small mt-1"
                     th:errors="*{amountLimit}">
                </div>

            </div>

            <!-- Bulan -->
            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Bulan
                </label>

                <select th:field="*{month}"
                        class="form-select"
                        required>

                    <option value="">Pilih Bulan</option>
                    <option value="1">Januari</option>
                    <option value="2">Februari</option>
                    <option value="3">Maret</option>
                    <option value="4">April</option>
                    <option value="5">Mei</option>
                    <option value="6">Juni</option>
                    <option value="7">Juli</option>
                    <option value="8">Agustus</option>
                    <option value="9">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Desember</option>

                </select>

                <div class="text-danger small mt-1"
                     th:errors="*{month}">
                </div>

            </div>

            <!-- Tahun -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Tahun
                </label>

                <input type="number"
                       th:field="*{year}"
                       class="form-control"
                       min="2020"
                       max="2100"
                       required>

                <div class="text-danger small mt-1"
                     th:errors="*{year}">
                </div>

            </div>

            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary flex-fill"
                        th:disabled="${#lists.isEmpty(categories)}">
                    Simpan Anggaran
                </button>

                <a href="/budgets"
                   class="btn btn-outline-secondary flex-fill">
                    Batal
                </a>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
